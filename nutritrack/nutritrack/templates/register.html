{% extends "base.html" %}
{% block title %}Register — NutriTrack{% endblock %}
{% block content %}
<section class="auth-panel">
  <h1 class="panel-title">Create an account</h1>
  <p class="panel-sub">Your password is stored as a SHA-256 hash, never in plain text.</p>

  <form method="POST" class="stack-form">
    <label class="field">
      <span>Username</span>
      <input type="text" name="username" autocomplete="username" required autofocus>
    </label>
    <label class="field">
      <span>Password</span>
      <input type="password" name="password" autocomplete="new-password" minlength="4" required>
    </label>
    <label class="field">
      <span>Confirm password</span>
      <input type="password" name="confirm" autocomplete="new-password" minlength="4" required>
    </label>
    <button type="submit" class="btn-primary">Register</button>
  </form>

  <p class="switch-line">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</section>
{% endblock %}
