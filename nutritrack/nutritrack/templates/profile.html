{% extends "base.html" %}
{% block title %}Your details — NutriTrack{% endblock %}
{% block content %}
<section class="form-panel">
  <h1 class="panel-title">Today's numbers</h1>
  <p class="panel-sub">Fill this in once to get your calorie target, macros, and a workout split.</p>

  <form method="POST" class="grid-form">
    <div class="field-row">
      <label class="field">
        <span>Age (years)</span>
        <input type="number" name="age" min="10" max="100" required>
      </label>
      <label class="field">
        <span>Gender</span>
        <select name="gender" required>
          <option value="" disabled selected>Select</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
      </label>
    </div>

    <div class="field-row">
      <label class="field">
        <span>Height (cm)</span>
        <input type="number" name="height" step="0.1" min="100" max="250" required>
      </label>
      <label class="field">
        <span>Weight (kg)</span>
        <input type="number" name="weight" step="0.1" min="30" max="300" required>
      </label>
    </div>

    <label class="field">
      <span>Activity level</span>
      <select name="activity" required>
        <option value="" disabled selected>Select</option>
        <option value="sedentary">Sedentary — little to no exercise</option>
        <option value="light">Light — 1-3 days/week</option>
        <option value="moderate">Moderate — 3-5 days/week</option>
        <option value="active">Active — 6-7 days/week</option>
        <option value="athlete">Athlete — very hard training</option>
      </select>
    </label>

    <fieldset class="field-group">
      <legend>Diet goal</legend>
      <label class="radio-pill">
        <input type="radio" name="diet" value="bulking" required>
        <span>Bulking</span>
      </label>
      <label class="radio-pill">
        <input type="radio" name="diet" value="cutting">
        <span>Cutting</span>
      </label>
      <label class="radio-pill">
        <input type="radio" name="diet" value="maintenance">
        <span>Maintenance</span>
      </label>
    </fieldset>

    <fieldset class="field-group">
      <legend>Workout setting</legend>
      <label class="radio-pill">
        <input type="radio" name="workout" value="gym" required>
        <span>Gym</span>
      </label>
      <label class="radio-pill">
        <input type="radio" name="workout" value="home">
        <span>Home</span>
      </label>
    </fieldset>

    <button type="submit" class="btn-primary">Calculate my plan</button>
  </form>
</section>
{% endblock %}
